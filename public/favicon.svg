<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Brand Gradient: Slate Blue to Cyan -->
    <linearGradient id="nookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cozy Glow Light Gradient -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#67E8F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Transparent background with an elegant glowing squircle border -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="#05070C" stroke="url(#nookGrad)" stroke-width="24" />

  <!-- Stylized Book + Nook (House Outline) Shape -->
  <path d="M256,110 L410,220 L410,390 L256,335 L102,390 L102,220 Z" fill="url(#nookGrad)" />

  <!-- Inner cozy shelter opening (hollow book pages) -->
  <path d="M256,165 L365,242 L365,342 L256,302 L147,342 L147,242 Z" fill="#05070C" />

  <!-- Center Glowing Spark (Cozy Study Light / Focus Star) -->
  <path d="M256,200 L262,222 L284,228 L262,234 L256,256 L250,234 L228,228 L250,222 Z" fill="url(#lightGrad)" />
</svg>